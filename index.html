<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renueva</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { margin-bottom: 20px; }
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .tarjeta {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      padding-bottom: 15px;
    }
    .tarjeta img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .precio {
      font-size: 1.3em;
      color: #4ade80;
      font-weight: bold;
      margin: 10px 0;
    }
    .btn-comprar {
      display: inline-block;
      padding: 10px 20px;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
    }
    .btn-comprar:hover { background-color: #1eb954; }
  </style>
</head>
<body>

  <h1>Renueva</h1>

  <div class="galeria">

    <!-- PRODUCTO 1 -->
    <div class="tarjeta">
      <img src="https://via.placeholder.com/400" alt="Producto 1">
      <h3>Nombre del Producto 1</h3>
      <div class="precio">€25.00</div>
      <a href="https://wa.me/TUNUMERODETELEFONO?text=Hola,%20quiero%20comprar%20el%20Producto%201" target="_blank" class="btn-comprar">💬 Comprar por WhatsApp</a>
    </div>

    <!-- PRODUCTO 2 -->
    <div class="tarjeta">
      <img src="URL_DE_TU_IMAGEN_2" alt="Producto 2">
      <h3>Nombre del Producto 2</h3>
      <div class="precio">€30.00</div>
      <a href="https://wa.me/34612345678?text=Hola,%20quiero%20comprar%20el%20Producto%202" target="_blank" class="btn-comprar">💬 Comprar por WhatsApp</a>
    </div>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
